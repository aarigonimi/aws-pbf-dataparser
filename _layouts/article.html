<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | escape }}">
    <meta name="author" content="Aboubacar Ari Gonimi">
    <meta name="theme-color" content="#0b0e11">
    <title>{{ page.title | escape }} · aws-pbf-dataparser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <nav class="top-nav" aria-label="Main navigation">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span>aws-pbf<span class="brand-light">-dataparser</span></span>
        </a>
        <div class="nav-right">
          <a href="https://github.com/aarigonimi/aws-pbf-dataparser/blob/main/docs/ARCHITECTURE.md" target="_blank" rel="noreferrer">Architecture</a>
          <a href="https://github.com/aarigonimi/aws-pbf-dataparser/blob/main/docs/deployment.md" target="_blank" rel="noreferrer">Deployment</a>
          <a class="nav-github" href="https://github.com/aarigonimi/aws-pbf-dataparser" target="_blank" rel="noreferrer">
            <span>GitHub Repository ↗</span>
          </a>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="story-head">
        <div class="story-eyebrow"><span class="eyebrow-rule"></span> AWS DATA ENGINEERING</div>
        <h1 class="story-title">{{ page.title | escape }}</h1>
        <p class="story-deck">{{ page.description | escape }}</p>
      </section>

      <div class="article-layout" id="article">
        <article class="article-copy">
          {{ content }}
        </article>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <a class="footer-brand" href="{{ '/' | relative_url }}">aws-pbf-dataparser</a>
        <span>OpenStreetMap data © OpenStreetMap contributors · ODbL</span>
        <a href="https://github.com/aarigonimi/aws-pbf-dataparser" target="_blank" rel="noreferrer">Source on GitHub ↗</a>
      </div>
    </footer>
  </body>
</html>
