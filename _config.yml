title: aws-pbf-dataparser
description: Event-driven OpenStreetMap PBF to Parquet pipeline on AWS Batch, Glue, and Athena.
url: https://aarigonimi.github.io
baseurl: /aws-pbf-dataparser
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
exclude:
  - .github
  - .gitignore
  - .dockerignore
  - .env.example
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Dockerfile
  - LICENSE
  - Makefile
  - README.md
  - SECURITY.md
  - Gemfile
  - Gemfile.lock
  - docs/article
  - infra
  - pyproject.toml
  - requirements-dev.txt
  - requirements.txt
  - scripts
  - src
  - sql
  - tests
