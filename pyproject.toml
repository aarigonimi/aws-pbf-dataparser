[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-pbf-data-lake"
version = "1.0.0"
description = "Serverless-ish OSM PBF to Parquet processing on AWS Batch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AWS Data Engineering" }]
dependencies = [
    "boto3==1.35.77",
    "botocore==1.35.77",
    "osmium==4.3.2",
    "pyarrow==17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[project.scripts]
osm-pbf-pipeline = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
